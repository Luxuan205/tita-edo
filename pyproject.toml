[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tita"
version = "0.1.0"
description = "Python library for solving ordinary differential equations using analytic, numeric and graphical methods."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Juan Diego Gonzalez Villarreal", email = "jdigonzalez@unbosque.edu.co" },
]
keywords = ["differential equations", "ODE", "numerical methods", "runge-kutta", "laplace", "sympy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "sympy>=1.12",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "black", "flake8", "build", "twine"]

[project.urls]
Homepage = "https://github.com/Luxuan205/tita-edo"
Repository = "https://github.com/Luxuan205/tita-edopip"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88